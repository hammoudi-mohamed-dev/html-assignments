<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>The H Projct</title>
    </head>
    <body>
        <div>
        <form  name="all input" target="_blank" novalidate>
            <div>
                <label>Search</label><br>
                <br>
                <input type="search" placeholder="Enter A Search Word" autofocus name="srch">
            </div>
            <br>
            <div>
                <label>Upload</label><br>
                <br>
                <input type="file" name="file">
            </div>
            <br>
            <div>
                <label>Url</label><br>
                <br>
                <input type="url" required name="link">
            </div>
            <br>
            <div>
                <label>Date</label>
                <input type="date" value="1982-10-25" name="date">
            </div>
            <br>
            <div>
                <label>Month</label>
                <input type="month" value="1982-10" name="month">
            </div>
            <br>
            <div>
                <input value="Empty" type="reset">
                <input type="submit" name="data" value="Save">
            </div>
        </form>
        </div>
    </body>
</html>
